[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-spending-analyzer"
version = "1.1.0"
description = "Turn supported bank CSV exports into local monthly spending reports."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Haylee Pulisciano"}]
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
spending-analyzer = "spending_analyzer:main"

[tool.setuptools]
packages = ["spending_analyzer"]
